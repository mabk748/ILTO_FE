name: stack

services:
  frontend:
    image: ilto-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ilto_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - ilto_network
      - ilto-backend-proxy

networks:
  ilto_network:
    external: true
    name: stack_ilto_network
  ilto-backend-proxy:
    external: true
    name: ilto-backend-proxy
